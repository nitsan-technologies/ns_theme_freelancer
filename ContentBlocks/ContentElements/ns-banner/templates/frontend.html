<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

    <header id="home" class="masthead bg-primary text-white text-center {f:if(condition: data.space_before_class, then: ' frame-space-before-{data.space_before_class}')}{f:if(condition: data.space_after_class, then: ' frame-space-after-{data.space_after_class}')}">
        <div class="container d-flex align-items-center flex-column">
            <f:if condition="{data.image}">
                <f:for each="{data.image}" as="file">
                    <f:image image="{file}" maxWidth="255" maxHeight="270" />
                </f:for>
            </f:if>
            <f:variable name="headline" value="{data -> f:render.text(field: 'headline')}" />
            <f:if condition="{headline}">
                <h1 class="masthead-heading text-uppercase mb-0">{headline}</h1>
                <div class="divider-custom divider-light">
                    <div class="divider-custom-line"></div>
                    <div class="divider-custom-icon">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="divider-custom-line"></div>
                </div>
            </f:if>
            <f:variable name="text" value="{data -> f:render.text(field: 'text')}" />
            <f:if condition="{text}">
                <p class="masthead-subheading font-weight-light mb-0">{text}</p>
            </f:if>
        </div>
    </header>
</html>
