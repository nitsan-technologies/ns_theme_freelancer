name: nitsan/ns-portfolio
typeName: nitsan_nsportfolio
group: t3karma_content_blocks
prefixFields: false
prefixType: vendor
fields:
  -
    identifier: title
    label: 'LLL:EXT:ns_theme_freelancer/Resources/Private/Language/locallang_flex.xlf:general.title'
    type: Text
  -
    identifier: portfolio
    label: 'LLL:EXT:ns_theme_freelancer/Resources/Private/Language/locallang_flex.xlf:portfolio.title'
    type: Collection
    fields:
      -
        identifier: image
        label: 'LLL:EXT:ns_theme_freelancer/Resources/Private/Language/locallang_flex.xlf:general.image'
        type: Link
        allowed:
          - file
        maxitems: 1
      -
        identifier: headline
        label: 'LLL:EXT:ns_theme_freelancer/Resources/Private/Language/locallang_flex.xlf:general.headline'
        type: Text
      -
        identifier: description
        label: 'LLL:EXT:ns_theme_freelancer/Resources/Private/Language/locallang_flex.xlf:general.description'
        type: Textarea
        rows: null
        enableRichtext: false
  -
    identifier: appearance_tab
    type: Tab
    label: Appearance
  -
    identifier: space_before_class
    type: Text
    useExistingField: true
  -
    identifier: space_after_class
    type: Text
    useExistingField: true
